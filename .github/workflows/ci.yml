name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-files ./cmd/pocket-files
      - name: Smoke test
        run: |
          mkdir -p /tmp/pf-mounts/media
          DATA_DIR=/tmp/pf DEMO_DATA=true AUTH_MODE=none PUBLIC_PORT=8081 MOUNT_ROOTS=/tmp/pf-mounts ./pocket-files &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS "http://localhost:8080/api/v1/fs/list?space=home&path=/" | grep -q Documents
          curl -fsS -X POST http://localhost:8080/api/v1/mounts -H 'Content-Type: application/json' -d '{"name":"Media","path":"/tmp/pf-mounts/media","everyone_perm":"view"}' | grep -q Media
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8081/s/whatever | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/v1/fs/list)" = 404

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-files:pr
